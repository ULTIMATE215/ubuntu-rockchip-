name: Build Resolute stable packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-resolute-stable.yml'
      - 'build.sh'
      - 'config/rk3588-stable.sh'
      - 'scripts/*kernel*.sh'
      - 'scripts/build-rk3588-media.sh'
      - 'scripts/pinned-source.sh'
      - 'patches/kernel/resolute/**'
      - 'patches/kernel/resolute-stable/**'
      - 'patches/uu-remote-linux/**'
      - 'overlay/usr/lib/udev/rules.d/60-rk3588-mpp.rules'

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    container: ubuntu:26.04
    steps:
      - name: Install Ubuntu 26.04 build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates build-essential \
            bc bison flex xz-utils zstd libssl-dev libelf-dev libdw-dev cpio kmod \
            fakeroot debhelper rsync device-tree-compiler python3
      - uses: actions/checkout@v4
      - run: ./build.sh --suite=resolute --kernel=stable --kernel-only
      - uses: actions/upload-artifact@v4
        with:
          name: resolute-stable-kernel-arm64
          path: build/stable-kernel/*.deb
          if-no-files-found: error

  media:
    runs-on: ubuntu-24.04-arm
    container: ubuntu:26.04
    strategy:
      matrix:
        component: [ffmpeg, uu]
    steps:
      - name: Install Ubuntu 26.04 build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates build-essential pkgconf
          case "${{ matrix.component }}" in
            ffmpeg)
              apt-get install -y --no-install-recommends cmake libdrm-dev libudev-dev \
                zlib1g-dev libpulse-dev libopus-dev libx264-dev libx265-dev libxcb1-dev \
                libxcb-shm0-dev libxcb-xfixes0-dev
              ;;
            uu)
              apt-get install -y --no-install-recommends cargo rustc ffmpeg libx11-dev libxext-dev \
                libxtst-dev libxfixes-dev libgtk-3-dev libglib2.0-dev libwayland-dev \
                libxkbcommon-dev libpipewire-0.3-dev libei-dev libsdl2-dev
              ;;
          esac
      - uses: actions/checkout@v4
      - run: bash scripts/build-rk3588-media.sh ${{ matrix.component }}
      - uses: actions/upload-artifact@v4
        with:
          name: resolute-${{ matrix.component }}-arm64
          path: build/*.deb
          if-no-files-found: error
